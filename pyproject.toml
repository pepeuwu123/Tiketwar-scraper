[project]
name = "tiketwar-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.47",
  "redis>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fakeredis>=2.24",   # tests/test_runner.py needs a fake redis
]

[tool.pytest.ini_options]
testpaths = ["tests"]
