name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

env:
  # Docker requires lowercase repository names, and the GitHub repos are
  # named Tiketwar-* with a capital T, so github.repository cannot be used.
  IMAGE: ghcr.io/pepeuwu123/tiketwar-scraper

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha- tag for rollback; main for "what is latest". Never only :latest.
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Opt-in: needs a self-hosted runner labelled `tiketwar` on the VM.
    # Without the variable the job is skipped instead of queuing forever.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, tiketwar]
    steps:
      - name: deploy the pushed tag on the tiketwar VM
        working-directory: /opt/tiketwar
        run: |
          echo "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}" > .deployed-tag
          docker compose pull || true
          docker compose up -d --remove-orphans
          docker compose ps
          # Fail the workflow loudly rather than leaving a half-up stack.
          curl -fsS --retry 10 --retry-delay 3 http://localhost:8080/healthz
